<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Audio Visualizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="https://lottie.host/1abb478c-5818-4e86-a7c2-cb70168528c8/gta04BxJ9Q.png">
</head>
<body>
    <canvas id="visualizer"></canvas>
    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <div class="app-wrapper">
        <!-- Top Navbar -->
        <header class="top-nav glass">
            <div class="logo"><i class="fas fa-wave-square"></i> AudioVision</div>
            <div class="top-controls" style="display:flex; gap:10px;">
                <!-- Equalizer Open Button -->
                <button id="openEqBtn" class="btn outline-btn"><i class="fas fa-sliders-h"></i> Equalizer</button>
                <button id="toggleUiBtn" class="btn glass-btn"><i class="fas fa-eye-slash"></i></button>
                <button id="modeTabBtn" class="btn glass-btn"><i class="fas fa-desktop"></i></button>
            </div>
        </header>

        <!-- Main Content Area (Only Playlist Now) -->
        <main class="main-content" id="mainPanels">
            <aside class="sidebar glass" style="width: 100%; max-width: 600px; margin: 0 auto;">
                <div class="section-header"><h3><i class="fas fa-music"></i> My Library</h3></div>
                
                <div class="upload-box">
                    <input type="text" id="songTitle" placeholder="Song Title" required>
                    <input type="file" id="audioFile" accept="audio/*" style="display: none;" required>
                    <div class="upload-actions">
                        <label for="audioFile" class="btn outline-btn"><i class="fas fa-folder-open"></i> File</label>
                        <button id="uploadBtn" class="btn primary-btn"><i class="fas fa-upload"></i> Upload</button>
                    </div>
                </div>

                <ul id="playlist" class="custom-scroll"></ul>
            </aside>
        </main>

        <!-- Bottom Player Bar -->
        <footer class="bottom-player glass">
            <div class="track-info">
                <div class="art"><i class="fas fa-compact-disc fa-spin-hover"></i></div>
                <div class="details">
                    <h4 id="currentSongTitle">No track selected</h4>
                    <p>AudioVision Player</p>
                </div>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button class="icon-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                    <button class="icon-btn play-pause-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                    <button class="icon-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                </div>
                <div class="progress-bar">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="seekSlider" value="0" min="0" max="100" step="1">
                    <span id="durationTime">0:00</span>
                </div>
            </div>

           <div class="visualizer-settings">
    <i class="fas fa-bolt" title="Sensitivity" style="color: #888; font-size: 14px;"></i>
    <input type="range" id="sensitivitySlider" min="0.3" max="2" step="0.1" value="1" style="width: 50px;">
    
                 <select id="themeSelector" class="custom-select">
                     <option value="bars">Bars (Classic)</option>
                    <option value="circle">Pulse Circle</option>
                    <option value="wave">Smooth Wave</option>
                    <option value="symmetric">Symmetric</option>
                    <option value="particles">Beat Particles</option>
                    <!-- নতুন দুটি প্রিমিয়াম থিম -->
                    <option value="galaxy">Premium: Galaxy</option>
                    <option value="polygon">Premium: Neon Polygon</option>
                    <option value="sunburst">Premium: Sunburst</option>
                    <option value="terrain">Premium: Cyber Mountain</option>
                    <option value="orbits">Premium: Dual Orbits</option>
                    <option value="my_custom_theme">Premium: My Custom Theme</option>
                   
                </select>

    <!-- RGB / Multi-Color Button -->
    <button id="rgbModeBtn" class="btn outline-btn" title="Toggle Multi-Color" style="padding: 4px 10px; border-radius: 5px;"><i class="fas fa-rainbow"></i></button>

    <input type="color" id="themeColor" value="#00ffcc" title="Theme Color">
</div>
        </footer>
    </div>

    <!-- 🌟 VIRTUAL PAGE FOR EQUALIZER 🌟 -->
    <div id="eqVirtualPage" class="eq-virtual-page hidden">
        <div class="eq-page-header">
            <button id="closeEqBtn" class="btn glass-btn"><i class="fas fa-chevron-down"></i> Back to Player</button>
            <h2><i class="fas fa-sliders-h"></i> Equalizer Studio</h2>
            <button id="resetEqBtn" class="btn outline-btn"><i class="fas fa-undo"></i> Reset</button>
        </div>
        
        <div class="eq-sliders-container">
            <div class="slider-wrapper"><input type="range" class="eq-band" data-freq="60" min="-12" max="12" value="0"><span>60Hz</span><p>Sub Bass</p></div>
            <div class="slider-wrapper"><input type="range" class="eq-band" data-freq="250" min="-12" max="12" value="0"><span>250Hz</span><p>Bass</p></div>
            <div class="slider-wrapper"><input type="range" class="eq-band" data-freq="1000" min="-12" max="12" value="0"><span>1kHz</span><p>Mid</p></div>
            <div class="slider-wrapper"><input type="range" class="eq-band" data-freq="4000" min="-12" max="12" value="0"><span>4kHz</span><p>Presence</p></div>
            <div class="slider-wrapper"><input type="range" class="eq-band" data-freq="12000" min="-12" max="12" value="0"><span>12kHz</span><p>Treble</p></div>
        </div>
    </div>

    <!-- Scripts -->
    <script> window.AudioVisualizers = {}; </script>
    <script src="visualizers/bars.js"></script>
    <script src="visualizers/circle.js"></script>
    <script src="visualizers/wave.js"></script>
    <script src="visualizers/symmetric.js"></script>
    <script src="visualizers/particles.js"></script>
    <script src="visualizers/galaxy.js"></script>
    <script src="visualizers/polygon.js"></script>
    <script src="visualizers/sunburst.js"></script>
    <script src="visualizers/terrain.js"></script>
    <script src="visualizers/orbits.js"></script>
    <script src="visualizers/my_custom_theme.js"></script>
   
    <script src="script.js"></script>
</body>
</html>
